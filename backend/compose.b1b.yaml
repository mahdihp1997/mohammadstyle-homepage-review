name: mohammadstyle-b1b
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: ms_b1a_admin
      POSTGRES_DB: ms_b1b_control
      POSTGRES_PASSWORD: ${B1B_ADMIN_PASSWORD:?run npm run b1b:env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ["127.0.0.1:55436:5432"]
    volumes: ["b1b_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_b1a_admin -d ms_b1b_control"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [b1b]
networks:
  b1b: { driver: bridge }
volumes:
  b1b_pgdata:
    labels: { com.mohammadstyle.purpose: phase03b-b1b-disposable }
