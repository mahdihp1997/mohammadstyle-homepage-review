name: mohammadstyle-b3
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: ms_b1a_admin
      POSTGRES_DB: ms_b3_control
      POSTGRES_PASSWORD: ${B3_ADMIN_PASSWORD:?run npm run b3:env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ["127.0.0.1:55444:5432"]
    volumes: ["b3_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ms_b1a_admin -d ms_b3_control"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [b3]
networks:
  b3: { driver: bridge }
volumes:
  b3_pgdata:
    labels: { com.mohammadstyle.purpose: phase03b-b3-disposable }
