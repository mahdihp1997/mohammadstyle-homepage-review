services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ms_b1a_admin
      POSTGRES_PASSWORD: ${PRODUCT_ADMIN_PASSWORD:?local test secret required}
      POSTGRES_DB: ms_product_control
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:55460:5432"
    volumes:
      - product_test_pg:/var/lib/postgresql
    command: ["postgres", "-c", "max_connections=150", "-c", "log_statement=none", "-c", "log_min_error_statement=panic"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_b1a_admin -d ms_product_control"]
      interval: 2s
      timeout: 3s
      retries: 40
    labels:
      mohammadstyle.profile: isolated-product-test-v1
volumes:
  product_test_pg:
    labels:
      mohammadstyle.profile: isolated-product-test-v1
