name: mohammadstyle-b0
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: ms_b0_admin
      POSTGRES_DB: ms_b0_control
      POSTGRES_PASSWORD: ${B0_ADMIN_PASSWORD:?run npm run env:init}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - b0_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_b0_admin -d ms_b0_control"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [b0]
  api:
    build: .
    environment:
      APP_ENV: b0-local
      API_HOST: 0.0.0.0
      API_PORT: 3100
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ms_b0_control
      PGUSER: ms_b0_probe
      PGPASSWORD: ${B0_PROBE_PASSWORD:?run npm run env:init}
    ports:
      - "127.0.0.1:3100:3100"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [b0]
networks:
  b0:
    driver: bridge
volumes:
  b0_pgdata:
    labels:
      com.mohammadstyle.purpose: phase03b-b0-disposable
