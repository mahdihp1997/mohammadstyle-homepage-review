# An owner-only private bucket is checked before storage is used. No public ACLs.
services:
  api:
    environment: &s3
      PRODUCT_STORAGE: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?HTTPS S3-compatible endpoint}
      S3_BUCKET: ${S3_BUCKET:?dedicated private bucket}
      S3_REGION: ${S3_REGION:?signing region}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
  backup:
    environment: *s3
    secrets: [s3_access_key, s3_secret_key]
    networks: [application, database]
secrets:
  s3_access_key: {file: '${SECRETS_DIR}/s3_access_key'}
  s3_secret_key: {file: '${SECRETS_DIR}/s3_secret_key'}
