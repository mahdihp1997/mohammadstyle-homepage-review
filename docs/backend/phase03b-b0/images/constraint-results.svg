<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="858" viewBox="0 0 1320 858"><rect width="1320" height="858" fill="#f4f7fb"/><rect x="30" y="30" width="1260" height="798" rx="18" fill="white" stroke="#ccd7e6"/><text x="65" y="89" font-family="Arial" font-size="32" font-weight="bold" fill="#172c48">Constraint evidence and its boundary</text><text x="65" y="131" font-family="Arial" font-size="20" fill="#52647a">Real PostgreSQL tests · selected predicates, not a complete Booking Engine</text><rect x="60" y="165" width="1200" height="60" rx="7" fill="#e8f7ee"/><text x="80" y="203" font-family="Arial" font-size="21" fill="#20334a">Tenant FK / unique / missing or invalid configuration: rejected as expected</text><rect x="60" y="237" width="1200" height="60" rx="7" fill="#f1f5fa"/><text x="80" y="275" font-family="Arial" font-size="21" fill="#20334a">B1: fully populated offering and branch activation gates reject23514</text><rect x="60" y="309" width="1200" height="60" rx="7" fill="#e8f7ee"/><text x="80" y="347" font-family="Arial" font-size="21" fill="#20334a">Two customers: distinct quote IDs and identical content hash accepted</text><rect x="60" y="381" width="1200" height="60" rx="7" fill="#f1f5fa"/><text x="80" y="419" font-family="Arial" font-size="21" fill="#20334a">Membership: inactive/archive overlap23P01; adjacent rejoin accepted</text><rect x="60" y="453" width="1200" height="60" rx="7" fill="#e8f7ee"/><text x="80" y="491" font-family="Arial" font-size="21" fill="#20334a">Revisionless DRAFT / CANCELLED / EXPIRED accepted; invalid plan shape rejected</text><rect x="60" y="525" width="1200" height="60" rx="7" fill="#f1f5fa"/><text x="80" y="563" font-family="Arial" font-size="21" fill="#20334a">Resource / global shift / equal-rank policy exclusions reject23P01</text><rect x="60" y="597" width="1200" height="60" rx="7" fill="#e8f7ee"/><text x="80" y="635" font-family="Arial" font-size="21" fill="#20334a">Two sessions: observed PostgreSQL Lock wait; winner commit, loser23P01</text><rect x="60" y="669" width="1200" height="60" rx="7" fill="#f1f5fa"/><text x="80" y="707" font-family="Arial" font-size="21" fill="#20334a">Deferred FK success/failing COMMIT and explicit transaction rollback verified</text><rect x="60" y="741" width="1200" height="60" rx="7" fill="#e8f7ee"/><text x="80" y="779" font-family="Arial" font-size="21" fill="#20334a">Deferred: actor auth, full plan coverage, immutability and booking races</text></svg>
