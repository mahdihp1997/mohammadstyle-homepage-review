<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1777" viewBox="0 0 1490 1777" role="img" aria-label="Payment and refund architecture sequence"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="745" y="38" font-family="Arial,sans-serif" font-size="26" fill="#172033" text-anchor="middle">Payment / refund sequence — Phase03A hardening</text><text x="745" y="69" font-family="Arial,sans-serif" font-size="16" fill="#172033" text-anchor="middle">Specification only · time moves down · provider calls outside database locks</text><rect x="10" y="90" width="230" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="125" y="118" font-family="Arial,sans-serif" font-size="17" fill="#172033" text-anchor="middle">Customer / UI</text><rect x="320" y="90" width="230" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="435" y="118" font-family="Arial,sans-serif" font-size="17" fill="#172033" text-anchor="middle">Booking workflow</text><rect x="630" y="90" width="230" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="745" y="118" font-family="Arial,sans-serif" font-size="17" fill="#172033" text-anchor="middle">Payments / ledger</text><rect x="940" y="90" width="230" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="1055" y="118" font-family="Arial,sans-serif" font-size="17" fill="#172033" text-anchor="middle">Gateway</text><rect x="1250" y="90" width="230" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="1365" y="118" font-family="Arial,sans-serif" font-size="17" fill="#172033" text-anchor="middle">Outbox / worker</text><line x1="125" y1="134" x2="125" y2="1735" stroke="#cbd5e1" stroke-dasharray="5 5"/><line x1="435" y1="134" x2="435" y2="1735" stroke="#cbd5e1" stroke-dasharray="5 5"/><line x1="745" y1="134" x2="745" y2="1735" stroke="#cbd5e1" stroke-dasharray="5 5"/><line x1="1055" y1="134" x2="1055" y2="1735" stroke="#cbd5e1" stroke-dasharray="5 5"/><line x1="1365" y1="134" x2="1365" y2="1735" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="18" y="140" width="1454" height="34" rx="5" fill="#dbeafe"/><text x="30" y="163" font-family="Arial,sans-serif" font-size="16" fill="#172033" text-anchor="start">1 / Verified capture — common path</text><line x1="125" y1="224" x2="435" y2="224" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="280" y="212" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">1. Hold and accept actor-owned quote</text><line x1="435" y1="300" x2="745" y2="300" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="590" y="288" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">2. Persist intent + stable operation key</text><line x1="745" y1="376" x2="1055" y2="376" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="900" y="364" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">3. Initialize outside DB transaction</text><line x1="1055" y1="452" x2="125" y2="452" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="590" y="440" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">4. Redirect customer to selected gateway</text><line x1="1055" y1="528" x2="745" y2="528" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="900" y="516" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">5. Untrusted callback signal; dedup inbox</text><line x1="745" y1="604" x2="1055" y2="604" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="900" y="592" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">6. Server verify merchant / exact unit / amount</text><line x1="1055" y1="680" x2="745" y2="680" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="900" y="668" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">7. Verified capture; unique transaction reference</text><line x1="745" y1="756" x2="435" y2="756" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="590" y="744" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">8. Durable PaymentCaptured workflow</text><rect x="18" y="804" width="1454" height="34" rx="5" fill="#dcfce7"/><text x="30" y="827" font-family="Arial,sans-serif" font-size="16" fill="#172033" text-anchor="start">ALT A / Valid hold at DB-clock decision</text><path d="M 435 883 h 85 v 24 h -85" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="445" y="870" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="start">9. Lock resources &gt; booking/hold &gt; balance</text><line x1="435" y1="964" x2="125" y2="964" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="280" y="952" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">10. Apply capture + CONFIRMED + history/outbox</text><rect x="18" y="1012" width="1454" height="34" rx="5" fill="#fee2e2"/><text x="30" y="1035" font-family="Arial,sans-serif" font-size="16" fill="#172033" text-anchor="start">ALT B / Hold expired, changed revision or conflict — never execute A and B together</text><line x1="435" y1="1096" x2="745" y2="1096" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="590" y="1084" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">11. No resurrection; mark unapplied compensation</text><line x1="745" y1="1172" x2="1055" y2="1172" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="900" y="1160" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">12. Full unapplied refund/void; reconcile UNKNOWN</text><rect x="18" y="1220" width="1454" height="34" rx="5" fill="#fef3c7"/><text x="30" y="1243" font-family="Arial,sans-serif" font-size="16" fill="#172033" text-anchor="start">2 / Separate later flow — cancellation of an actually confirmed booking</text><line x1="125" y1="1304" x2="435" y2="1304" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="280" y="1292" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">13. Request cancellation using accepted terms</text><line x1="435" y1="1380" x2="745" y2="1380" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="590" y="1368" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">14. Calculate entitlement; lock refund budget</text><line x1="745" y1="1456" x2="1365" y2="1456" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1055" y="1444" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">15. Reserve funds + refund request outbox</text><line x1="1365" y1="1532" x2="1055" y2="1532" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1210" y="1520" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">16. Refund outside locks; stable refund ID</text><line x1="1055" y1="1608" x2="745" y2="1608" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="900" y="1596" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">17. Verified success or UNKNOWN reservation retained</text><line x1="745" y1="1684" x2="1365" y2="1684" stroke="#9a3412" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1055" y="1672" font-family="Arial,sans-serif" font-size="14" fill="#172033" text-anchor="middle">18. RefundCompleted only after verified success</text><text x="745" y="1762" font-family="Arial,sans-serif" font-size="15" fill="#172033" text-anchor="middle">UNKNOWN money outcome keeps reconciliation/refund budget pending; no fabricated booking or refund success.</text></svg>