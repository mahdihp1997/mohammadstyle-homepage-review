      name: ms_session
      description: Proposed opaque HttpOnly Secure SameSite session; hash at rest. Customer self/branch/resource
        checks. Selected authentication enrollment/OTP/IdP protocol remains an approval gate.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for cookie-authenticated mutation only; GET and read-only availability do not require
        CSRF. Origin checks remain mandatory.
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Proposed normalized selected-provider authentication, disabled until protocol chosen; some
        providers require another reviewed scheme. Cannot replace server-side verification.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Actor+route scope, canonical body hash, replay-safe durable result. Not a credential.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Quoted current row/config version; missing/stale returns412.
  schemas:
    Id:
      type: string
      format: uuid
    Version:
      type: string
      pattern: ^[1-9][0-9]*$
      description: Opaque row/config version, not a floating point number.
    Money:
      type: object
      additionalProperties: false
      properties:
        amountRial:
          type: string
          pattern: ^(0|[1-9][0-9]*0)$
          description: Integer decimal string; <=9223372036854775807 and multiple of 10 in IRR_RIAL_V1 MVP. No
            exponent/fraction/sign.
        currency:
          type: string
          enum:
            - IRR
        unitVersion:
          type: string
          enum:
            - IRR_RIAL_V1
      required:
        - amountRial
        - currency
        - unitVersion
      description: Exact integer money. Bounds, sum, safe conversion and currency checks are server invariants; see
        ADR-007.
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              code:
                type: string
            required:
              - field
              - code
          minItems: 0
      required:
        - code
        - message
        - requestId
        - retryable
    Branch:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        displayName:
          type: string
        address:
          type: string
          nullable: true
        timeZone:
          type: string
          example: Asia/Tehran
        active:
          type: boolean
        bookable:
          type: boolean
        version:
          $ref: "#/components/schemas/Version"
      required:
        - id
        - code
        - displayName
        - address
        - timeZone
        - active
        - bookable
        - version
    Service:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean
      required:
        - id
        - code
        - displayName
        - description
        - active
    Offering:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        service:
          $ref: "#/components/schemas/Service"
        active:
          type: boolean
        price:
          $ref: "#/components/schemas/Money"
        durationMinutes:
          type: integer
          minimum: 1
          nullable: true
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          nullable: true
        bufferAfterMinutes:
          type: integer
          minimum: 0
          nullable: true
        configurationVersion:
          $ref: "#/components/schemas/Version"
        bookable:
          type: boolean
        configurationIssues:
          type: array
          items:
            type: string
          minItems: 0
      required:
        - id
        - branchId
        - service
        - active
        - configurationVersion
        - bookable
        - configurationIssues
      description: Missing price means unknown, never zero. Public response omits unverified amounts; nullable
        duration/buffers remain unknown. Admin DTO has explicit nulls.
    Barber:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        eligibleOfferingIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
        branchId:
          type: string
          format: uuid
      required:
        - id
        - displayName
        - eligibleOfferingIds
        - branchId
      description: Public consented profile only. Eligibility is not a guarantee of availability. No user/customer
        contact data.
    ProviderPreference:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - ANY_ELIGIBLE
            - SPECIFIC
        staffId:
          type: string
          format: uuid
      required:
        - mode
      description: staffId required exactly for SPECIFIC; otherwise forbidden. Initial MVP one staff member for all items.
    AvailabilitySearch:
      type: object
      additionalProperties: false
      properties:
        branchId:
          type: string
          format: uuid
        offeringIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        localDate:
          type: string
          format: date
        timeZone:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderPreference"
      required:
        - branchId
        - offeringIds
        - localDate
        - timeZone
        - provider
      description: Unique offering IDs; branch timezone must match configured IANA timezone; horizon/lead time and
        active verified configuration checked. No client durations, prices or allocation objects.
    ResourceAssignment:
      type: object
      additionalProperties: false
      properties:
        resourceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - STAFF
            - CHAIR
            - ROOM
            - DEVICE
        staffId:
          type: string
          format: uuid
      required:
        - resourceId
        - kind
    PlanSegment:
      type: object
      additionalProperties: false
      properties:
        sequence:
          type: integer
          minimum: 1
        offeringId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
        bufferBeforeMinutes:
          type: integer
          minimum: 0
        bufferAfterMinutes:
          type: integer
          minimum: 0
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceAssignment"
          minItems: 1
        dependsOnSequences:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 0
      required:
        - sequence
        - offeringId
        - serviceId
        - staffId
        - startsAt
        - endsAt
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - resources
        - dependsOnSequences
      description: Server-owned whole-plan segment; sequential and same provider in MVP. Future parallel execution
        needs approved dependency/occupancy rules.
    BookingPlan:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 16
        source:
          type: string
          enum:
            - SERVER
        branchId:
          type: string
          format: uuid
        localDate:
          type: string
          format: date
        localStartTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        timeZone:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
        eligibleStaffIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        configurationFingerprint:
          type: string
        expiresAt:
          type: string
          format: date-time
        segments:
          type: array
          items:
            $ref: "#/components/schemas/PlanSegment"
          minItems: 1
      required:
        - id
        - source
        - branchId
        - localDate
        - localStartTime
        - timeZone
        - startsAt
        - endsAt
        - durationMinutes
        - eligibleStaffIds
        - configurationFingerprint
        - expiresAt
        - segments
      description: Opaque short-lived server plan; no capacity reservation. A returned plan can lose availability.
        Mutation endpoints accept the ID only and recompute all facts.
    AvailabilityResult:
      type: object
      additionalProperties: false
      properties:
        requestKey:
          type: string
        configurationFingerprint:
          type: string
        generatedAt:
          type: string
          format: date-time
        plans:
          type: array
          items:
            $ref: "#/components/schemas/BookingPlan"
          minItems: 0
      required:
        - requestKey
        - configurationFingerprint
        - generatedAt
        - plans
      description: Frontend request generation is still local. Echoed key alone is not authentication or proof that
        a plan is current.
    QuoteRequest:
      type: object
      additionalProperties: false
      properties:
        planId:
          type: string
        optionalDepositChosen:
          type: boolean
        bookingId:
          type: string
          format: uuid
      required:
        - planId
        - optionalDepositChosen
      description: bookingId only when actor may quote an existing draft/reschedule. Server rejects invented or
        unrelated scope.
    QuoteItem:
      type: object
      additionalProperties: false
      properties:
        offeringId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        offeringVersion:
          $ref: "#/components/schemas/Version"
        displayName:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        durationMinutes:
          type: integer
          minimum: 1
        bufferBeforeMinutes:
          type: integer
          minimum: 0
        bufferAfterMinutes:
          type: integer
          minimum: 0
      required:
        - offeringId
        - serviceId
        - offeringVersion
        - displayName
        - amount
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
    RefundWindow:
      type: object
      additionalProperties: false
      properties:
        minMinutesBeforeStart:
          type: integer
          minimum: 0
        refundBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
      required:
        - minMinutesBeforeStart
        - refundBasisPoints
    PolicyTerms:
      type: object
      additionalProperties: false
      properties:
        policyVersionId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        depositRequirement:
          type: string
          enum:
            - NONE
            - OPTIONAL
            - REQUIRED
        amountKind:
          type: string
          enum:
            - FIXED
            - PERCENTAGE
        fixedAmount:
          $ref: "#/components/schemas/Money"
        basisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        minimum:
          $ref: "#/components/schemas/Money"
        maximum:
          $ref: "#/components/schemas/Money"
        refundMode:
          type: string
          enum:
            - FULL
            - NONE
            - PARTIAL
            - CONDITIONAL
        refundBase:
          type: string
          enum:
            - DEPOSIT_PAID
            - ALL_PAID
        outsideRefundBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        windows:
          type: array
          items:
            $ref: "#/components/schemas/RefundWindow"
          minItems: 0
        termsText:
          type: string
        locale:
          type: string
        artifactHash:
          type: string
        resolverVersion:
          type: string
      required:
        - policyVersionId
        - version
        - depositRequirement
        - refundMode
        - refundBase
        - outsideRefundBasisPoints
        - windows
        - termsText
        - locale
        - artifactHash
        - resolverVersion
      description: Publication validation enforces conditional amount fields, min<=max, unique thresholds, immutable
        content/hash. NONE forbids amount fields. No default business deposit/refund rule is invented.
    Quote:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
        branchId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
          minItems: 1
        total:
          $ref: "#/components/schemas/Money"
        deposit:
          $ref: "#/components/schemas/Money"
        remaining:
          $ref: "#/components/schemas/Money"
        policy:
          $ref: "#/components/schemas/PolicyTerms"
        configurationFingerprint:
          type: string
        quoteHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        expiresAt:
          type: string
          format: date-time
        hashVersion:
          type: string
          enum:
            - MS_QUOTE_CONTENT_V2
      required:
        - id
        - planId
        - branchId
        - items
        - total
        - deposit
        - remaining
        - policy
        - configurationFingerprint
        - quoteHash
        - expiresAt
        - hashVersion
      description: "Immutable actor-owned quote; non-unique content-only SHA256/RFC8785 MS_QUOTE_CONTENT_V2. Exact
        payload: schema/quote-content.schema.json. Identity/idempotency/expiry are separate server checks.
        Independent customers may receive identical content hashes with different quote IDs."
    PolicyAcceptanceInput:
      type: object
      additionalProperties: false
      properties:
        quoteHash:
          type: string
        policyArtifactHash:
          type: string
        affirmativeConsent:
          type: boolean
          enum:
            - true
        locale:
          type: string
      required:
        - quoteHash
        - policyArtifactHash
        - affirmativeConsent
        - locale
    HoldRequest:
      type: object
      additionalProperties: false
      properties:
        quoteId:
          type: string
          format: uuid
        planId:
          type: string
        acceptance:
          $ref: "#/components/schemas/PolicyAcceptanceInput"
        bookingDraftId:
          type: string
          format: uuid
      required:
        - quoteId
        - planId
        - acceptance
      description: Optional bookingDraftId is an actor-owned live DRAFT only. Lock/revalidate draft context; create
        revision/hold then atomically set plan_committed=true,status=HELD,active_revision_id and clear
        draft_expires_at. Without it, the same draft root is transiently created inside the hold transaction.
    Hold:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - CONSUMED
            - EXPIRED
            - RELEASED
        expiresAt:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
      required:
        - id
        - bookingId
        - revisionId
        - status
        - expiresAt
        - version
    BookingStatus:
      type: string
      enum:
        - DRAFT
        - HELD
        - PENDING_PAYMENT
        - CONFIRMED
        - CHECKED_IN
        - IN_SERVICE
        - COMPLETED
        - CANCELLED
        - NO_SHOW
        - EXPIRED
    Booking:
      oneOf:
        - $ref: "#/components/schemas/UnplannedBooking"
        - $ref: "#/components/schemas/PlannedBooking"
      description: Disjoint proposed DTOs reflect plan_committed. Consumers must discriminate before accessing plan
        fields; no frontend code changed in03A.
    ConfirmBookingRequest:
      type: object
      additionalProperties: false
      properties:
        holdId:
          type: string
          format: uuid
      required:
        - holdId
      description: Idempotent application command. If positive accepted deposit due, returns PENDING_PAYMENT; cannot
        mark itself paid. Zero due consumes hold under lock and confirms.
    Reason:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 100
        note:
          type: string
          maxLength: 1000
      required:
        - reasonCode
    CancellationResult:
      type: object
      additionalProperties: false
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        refundCalculationId:
          type: string
          format: uuid
        refundableAmount:
          $ref: "#/components/schemas/Money"
        refundStatus:
          type: string
          enum:
            - NOT_REQUIRED
            - PENDING_REVIEW
            - QUEUED
            - UNKNOWN
      required:
        - booking
        - refundableAmount
        - refundStatus
    RescheduleRequest:
      type: object
      additionalProperties: false
      properties:
        newPlanId:
          type: string
        quoteId:
          type: string
          format: uuid
        acceptance:
          $ref: "#/components/schemas/PolicyAcceptanceInput"
        reasonCode:
          type: string
      required:
        - newPlanId
        - quoteId
        - acceptance
        - reasonCode
      description: MVP same accepted commercial terms only; union-lock old/new resources then atomic revision swap.
        Financial renegotiation returns 422 RESCHEDULE_REQUIRES_REVIEW.
    PaymentIntentRequest:
      type: object
      additionalProperties: false
      properties:
        bookingId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
            - DEPOSIT
            - REMAINDER
      required:
        - bookingId
        - revisionId
        - purpose
    PaymentIntent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - CREATED
            - INITIALIZING
            - AWAITING_CUSTOMER
            - VERIFIED
            - FAILED
            - EXPIRED
            - UNKNOWN
            - COMPENSATION_REQUIRED
        amount:
          $ref: "#/components/schemas/Money"
        expiresAt:
          type: string
          format: date-time
        redirectUrl:
          type: string
          format: uri
      required:
        - id
        - bookingId
        - revisionId
        - status
        - amount
        - expiresAt
      description: Redirect URL only from configured allowlisted HTTPS gateway. No client URL accepted. Gateway
        integration absent; provider capabilities must be reviewed.
    Refund:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        paymentTransactionId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum:
            - REQUESTED
            - APPROVED
            - PROCESSING
            - SUCCEEDED
            - FAILED
            - UNKNOWN
        reasonCode:
          type: string
      required:
        - id
        - paymentTransactionId
        - amount
        - status
        - reasonCode
    SessionView:
      type: object
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        userId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
          minItems: 0
        branchIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
        csrfToken:
          type: string
      required:
        - authenticated
      description: Only self session; no token/password hashes. Selected login/OTP/IdP and staff MFA protocol
        intentionally remains an open decision; no universal login endpoint is fabricated.
    BranchWrite:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          nullable: true
          maxLength: 1000
        timeZone:
          type: string
        active:
          type: boolean
        bookable:
          type: boolean
      required:
        - code
        - displayName
        - address
        - timeZone
        - active
        - bookable
      description: IANA timezone allowlist; bookable requires separately verified
        hours/offerings/staff/resources/policy. Deactivation cannot silently cancel occupied plans.
    ServiceWrite:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        active:
          type: boolean
      required:
        - code
        - displayName
        - description
        - active
    ResourceRequirement:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - CHAIR
            - ROOM
            - DEVICE
        quantity:
          type: integer
          minimum: 1
      required:
        - kind
        - quantity
    OfferingWrite:
      type: object
      additionalProperties: false
      properties:
        serviceId:
          type: string
          format: uuid
        active:
          type: boolean
        price:
          type: object
          nullable: true
          properties:
            amountRial:
              type: string
              pattern: ^(0|[1-9][0-9]*0)$
              description: Integer decimal string; <=9223372036854775807 and multiple of 10 in IRR_RIAL_V1 MVP. No
                exponent/fraction/sign.
            currency:
              type: string
              enum:
                - IRR
            unitVersion:
              type: string
              enum:
                - IRR_RIAL_V1
          required:
            - amountRial
            - currency
            - unitVersion
          additionalProperties: false
        durationMinutes:
          type: integer
          minimum: 1
          nullable: true
        bufferBeforeMinutes:
          type: integer
          minimum: 0
          nullable: true
        bufferAfterMinutes:
          type: integer
          minimum: 0
          nullable: true
        eligibleStaffIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
        resourcesConfirmed:
          type: boolean
        resourceRequirements:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRequirement"
          minItems: 0
      required:
        - serviceId
        - active
        - price
        - durationMinutes
        - bufferBeforeMinutes
        - bufferAfterMinutes
        - eligibleStaffIds
        - resourcesConfirmed
        - resourceRequirements
      description: Unknown is null. active requires all verified values, qualifications/membership and confirmed
        resource requirements. Configuration change checks live allocations under shared locks.
    StaffWrite:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        userId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
      required:
        - displayName
        - userId
        - active
    StaffView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        active:
          type: boolean
        version:
          $ref: "#/components/schemas/Version"
      required:
        - id
        - displayName
        - active
        - version
    StaffAssignmentWrite:
      type: object
      additionalProperties: false
      properties:
        branchId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true
        active:
          type: boolean
      required:
        - branchId
        - validFrom
        - validTo
        - active
      description: Creates one new half-open local-date membership period with its own ID. Same staff+branch may
        have multiple non-overlapping non-voided periods. Closed/inactive/archived periods still prevent
        historical overlap. Rejoin creates a new ID; never reuse old assignment.
    QualificationWrite:
      type: object
      additionalProperties: false
      properties:
        serviceId:
          type: string
          format: uuid
        active:
          type: boolean
        verificationReason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - serviceId
        - active
        - verificationReason
    WorkingWindow:
      type: object
      additionalProperties: false
      properties:
        isoWeekday:
          type: integer
          minimum: 1
          maximum: 7
        startMinute:
          type: integer
          minimum: 0
          maximum: 1439
        endMinute:
          type: integer
          minimum: 1
          maximum: 1440
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true
      required:
        - isoWeekday
        - startMinute
        - endMinute
